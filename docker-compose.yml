version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: devfest-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devfest_game_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devfest-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: devfest_game_db
      DB_PASSWORD: postgres
      DB_PORT: 5432
      JWT_SECRET: devfest_docker_jwt_secret_key_2026
      JWT_EXPIRES_IN: 7d
      INITIAL_ADMIN_EMAIL: admin@gdgranchi.in
      INITIAL_ADMIN_PASSWORD: AdminPass@2026
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
