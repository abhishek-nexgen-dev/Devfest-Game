version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: devfest-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: devfest_game_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devfest-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/devfest_game_db?schema=public
      JWT_SECRET: devfest_docker_jwt_secret_key_2026
      JWT_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
